name: Trigger auto deployment for codemeet-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/codemeet-backend-AutoDeployTrigger-497418eb-4ec6-45df-a168-c5eb86dde888.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CODEMEETBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CODEMEETBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CODEMEETBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: codemeet.azurecr.io
          registryUsername: ${{ secrets.CODEMEETBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CODEMEETBACKEND_REGISTRY_PASSWORD }}
          containerAppName: codemeet-backend
          resourceGroup: VisualStudioOnline-A24F8C8DC21C4BAEA973AF1DC8ACAA78
          imageToBuild: codemeet.azurecr.io/codemeet-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


